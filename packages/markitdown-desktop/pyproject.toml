[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-desktop"
dynamic = ["version"]
description = "Offline Windows desktop PDF to Markdown converter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "markitdown[pdf]",
  "Pillow>=10.0.0",
  "pypdf>=5.0.0",
  "pypdfium2>=4.30.0",
]

[project.scripts]
pdf-para-markdown = "markitdown_desktop.__main__:main"

[tool.hatch.version]
path = "src/markitdown_desktop/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_desktop"]

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_desktop"]

